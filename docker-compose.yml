services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sistemkios
      POSTGRES_USER: sistemkios
      POSTGRES_PASSWORD: sistemkios
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistemkios"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine

  web:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
