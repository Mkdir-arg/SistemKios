{# Tabla de stock por ubicación (el componente Alpine debe proveer: tablaUbic, filasFiltradas, filtro, soloConStock, tablaCargada). #}
<div class="mb-3 flex flex-wrap items-center justify-between gap-3">
  <h3 class="font-mono text-xs uppercase tracking-widest text-zinc-400 dark:text-zinc-600">Stock por producto</h3>
  <div class="flex items-center gap-4">
    <label class="flex items-center gap-2 text-xs text-zinc-500 dark:text-zinc-400">
      <input type="checkbox" x-model="soloConStock" class="h-4 w-4 rounded border-zinc-300 text-brand-600"> Solo con stock
    </label>
    <input x-model="filtro" type="search" placeholder="Buscar producto o código…" class="input max-w-[16rem] !py-2 text-sm">
  </div>
</div>

<div class="tablewrap rounded-2xl border border-zinc-200 dark:border-zinc-800">
  <table class="w-full text-sm">
    <thead>
      <tr class="border-b border-zinc-200 bg-zinc-50 text-left font-mono text-xs uppercase tracking-wider text-zinc-500 dark:border-zinc-800 dark:bg-zinc-800/60">
        <th class="px-4 py-2.5">Producto</th>
        <template x-for="u in tablaUbic" :key="u.nombre">
          <th class="px-3 py-2.5 text-center" :class="u.es_deposito ? 'text-brand-600 dark:text-brand-300' : ''" x-text="u.nombre"></th>
        </template>
        <th class="px-4 py-2.5 text-center">Total</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="f in filasFiltradas" :key="f.id">
        <tr class="border-b border-zinc-100 last:border-0 dark:border-zinc-800/60">
          <td class="px-4 py-2.5">
            <p class="font-medium" x-text="f.nombre"></p>
            <p class="font-mono text-xs text-zinc-400" x-text="f.categoria || f.codigo"></p>
          </td>
          <template x-for="(c, idx) in f.cantidades" :key="idx">
            <td class="tnum px-3 py-2.5 text-center"
                :class="[tablaUbic[idx] && tablaUbic[idx].es_deposito ? 'bg-brand-50/60 dark:bg-brand-500/5' : '', c === 0 ? 'text-zinc-300 dark:text-zinc-600' : '']"
                x-text="c"></td>
          </template>
          <td class="tnum px-4 py-2.5 text-center font-semibold" x-text="f.total"></td>
        </tr>
      </template>
    </tbody>
  </table>
  <template x-if="tablaCargada && !filasFiltradas.length">
    <p class="px-4 py-8 text-center text-sm text-zinc-400" x-text="filtro ? 'Sin resultados para «' + filtro + '».' : 'Todavía no hay stock cargado.'"></p>
  </template>
  <template x-if="!tablaCargada">
    <p class="px-4 py-8 text-center text-sm text-zinc-400">Cargando…</p>
  </template>
</div>
