{# Tabla de stock por ubicación (el componente Alpine debe proveer: tablaUbic, filasFiltradas, filtro, soloConStock, tablaCargada). #}
<div class="mb-3 flex flex-wrap items-center justify-between gap-3">
  <h3 class="section-title">Stock por producto</h3>
  <div class="flex flex-wrap items-center gap-4">
    <label class="flex items-center gap-2 text-sm text-zinc-500 dark:text-zinc-400">
      <input type="checkbox" x-model="soloConStock" class="h-4 w-4 rounded border-zinc-300 accent-brand-600"> Solo con stock
    </label>
    <input x-model="filtro" type="search" placeholder="Buscar producto o código…" aria-label="Buscar producto o código" class="input max-w-[16rem] !py-2 text-sm">
  </div>
</div>

<div class="tablewrap">
  <table class="table">
    <thead>
      <tr>
        <th class="min-w-[11rem]">Producto</th>
        <template x-for="u in tablaUbic" :key="u.nombre">
          <th class="!px-3 text-center" :class="u.es_deposito ? '!text-brand-600 dark:!text-brand-300' : ''" x-text="u.nombre"></th>
        </template>
        <th class="text-center">Total</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="f in filasFiltradas" :key="f.id">
        <tr>
          <td>
            <div class="flex items-center gap-3">
              <template x-if="f.imagen"><img :src="f.imagen" class="h-9 w-9 flex-none rounded-lg border border-zinc-200 object-cover dark:border-zinc-800" alt=""></template>
              <div class="min-w-0">
                <p class="font-medium" x-text="f.nombre"></p>
                <p class="font-mono text-xs text-zinc-400" x-text="f.categoria || f.codigo"></p>
              </div>
            </div>
          </td>
          <template x-for="(c, idx) in f.cantidades" :key="idx">
            <td class="tnum !px-3 text-center"
                :class="[tablaUbic[idx] && tablaUbic[idx].es_deposito ? 'bg-brand-50/60 dark:bg-brand-500/5' : '', c === 0 ? 'text-zinc-300 dark:text-zinc-600' : '']"
                x-text="c"></td>
          </template>
          <td class="tnum text-center font-semibold" x-text="f.total"></td>
        </tr>
      </template>
    </tbody>
  </table>
  <template x-if="tablaCargada && !filasFiltradas.length">
    <p class="table-empty" x-text="filtro ? 'Sin resultados para «' + filtro + '».' : 'Todavía no hay stock cargado.'"></p>
  </template>
  <template x-if="!tablaCargada">
    <p class="table-empty">Cargando…</p>
  </template>
</div>
