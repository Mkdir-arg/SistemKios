{# Renderiza un campo de formulario con label, ayuda y errores. #}
<div>
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="flex items-center gap-2 text-sm font-medium text-zinc-700 dark:text-zinc-300">
      {{ field }} {{ field.label }}
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-medium text-zinc-700 dark:text-zinc-300">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-zinc-400 dark:text-zinc-500">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-xs text-scan">{{ e }}</p>{% endfor %}
</div>
