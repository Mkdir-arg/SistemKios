{% extends "app_base.html" %}

{% block title %}Stock · SistemKios{% endblock %}
{% block page_title %}Stock{% endblock %}

{% block content %}
<div class="mx-auto max-w-5xl" x-data="stockTabla()" x-init="init()">
  <p class="mb-4 text-sm text-zinc-500 dark:text-zinc-400">Todo tu stock por ubicación: Depósito y cada punto, con el total general.</p>
  {% include "partials/stock_tabla.html" %}
</div>

<script>
  window.stockTabla = function () {
    return {
      tablaUbic: [], tablaFilas: [], filtro: "", soloConStock: true, tablaCargada: false,

      get filasFiltradas() {
        const q = this.filtro.trim().toLowerCase();
        return this.tablaFilas.filter((f) => {
          if (this.soloConStock && f.total <= 0) return false;
          if (!q) return true;
          return (f.nombre + " " + f.codigo + " " + f.categoria).toLowerCase().includes(q);
        });
      },

      async cargarTabla() {
        try {
          const r = await fetch("{% url 'stock:tabla' %}");
          const d = await r.json();
          this.tablaUbic = d.ubicaciones;
          this.tablaFilas = d.filas;
        } catch (e) {}
        this.tablaCargada = true;
      },

      init() { this.cargarTabla(); },
    };
  };
</script>
{% endblock %}
